[package]
name = "httparena-trillium-tuned"
version = "0.1.0"
edition = "2024"

[dependencies]
trillium = "1.1"
trillium-tokio = { version = "0.6", features = ["reuseport"] }
trillium-router = "0.5"
trillium-rustls = "0.11"
trillium-quinn = "0.1"
trillium-websockets = "0.8"
trillium-compression = "0.3"
trillium-askama = "0.4"
askama = "0.15"
trillium-logger = "0.5"

swansong = "0.3.4"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
querystrong = "0.4"

deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde_json = "1"

dashmap = "6"
log = "0.4"
env_logger = "0.11"
mimalloc = { version = "0.1", default-features = false }
socket2 = { version = "0.5", features = ["all"] }
num_cpus = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

# Override every trillium-* registry dep (direct + transitive) with the
# local clone staged at _trillium/ by scripts/stage-trillium.sh.
# Keeps a single trillium build in the dep graph (no version skew between
# our direct trillium and the trillium pulled in by trillium-compression).
[patch.crates-io]
trillium = { path = "_trillium/trillium" }
trillium-tokio = { path = "_trillium/tokio" }
trillium-router = { path = "_trillium/router" }
trillium-rustls = { path = "_trillium/rustls" }
trillium-quinn = { path = "_trillium/quinn" }
trillium-websockets = { path = "_trillium/websockets" }
trillium-compression = { path = "_trillium/compression" }
trillium-askama = { path = "_trillium/askama" }
trillium-logger = { path = "_trillium/logger" }
trillium-http = { path = "_trillium/http" }
trillium-server-common = { path = "_trillium/server-common" }
trillium-macros = { path = "_trillium/macros" }
